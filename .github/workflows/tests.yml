name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and free test dependencies
        run: python -m pip install -e ".[test,baselines,ecos]"
      - name: Verify evidence manifest
        run: python scripts/verify_manifest.py
      - name: Run test suite
        run: python -m pytest -q tests
